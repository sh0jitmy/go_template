version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - gosec
    - testifylint
    - paralleltest
    - tparallel
  settings:
    depguard:
      rules:
        global:
          files:
            - "$all"
            - "!**/ent/**"
            - "!**/ogen/**"
          deny:
            - pkg: "io/ioutil"
              desc: "Use os or io package instead (deprecated since Go 1.16)"
            - pkg: "github.com/pkg/errors"
              desc: "Use standard errors package and fmt.Errorf with %w"
        service-layer:
          files:
            - "**/internal/service/*.go"
            - "!$test"
          deny:
            - pkg: "github.com/gin-gonic/gin"
              desc: "Service layer must not depend on HTTP framework (gin)"
            - pkg: "net/http"
              desc: "Service layer must not depend on net/http transport"
            - pkg: "github.com/shjtmy/go_sh0jitmy_template/internal/web"
              desc: "Service layer must not depend on web layer"
            - pkg: "github.com/shjtmy/go_sh0jitmy_template/internal/database"
              desc: "Service layer must not depend on database setup package"
        database-layer:
          files:
            - "**/internal/database/*.go"
            - "!$test"
          deny:
            - pkg: "github.com/gin-gonic/gin"
              desc: "Database layer must not depend on HTTP framework (gin)"
            - pkg: "net/http"
              desc: "Database layer must not depend on net/http transport"
            - pkg: "github.com/shjtmy/go_sh0jitmy_template/internal/web"
              desc: "Database layer must not depend on web layer"
            - pkg: "github.com/shjtmy/go_sh0jitmy_template/internal/service"
              desc: "Database layer must not depend on service layer"
        domain-layer:
          files:
            - "**/internal/domain/**/*.go"
            - "**/internal/domain/*.go"
          deny:
            - pkg: "github.com/gin-gonic/gin"
              desc: "Domain layer must stay framework-agnostic"
            - pkg: "net/http"
              desc: "Domain layer must stay transport-agnostic"
            - pkg: "entgo.io/ent"
              desc: "Domain layer must not depend on ent ORM"
            - pkg: "database/sql"
              desc: "Domain layer must not depend on database/sql"
    govet:
      enable-all: true
      disable:
        - fieldalignment
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    gosec:
      excludes:
        - G104
    paralleltest:
      # 複製先プロジェクトでの柔軟性のために、必要に応じて個別のテスト設定を行えますが、
      # 基本的には t.Parallel() の使用を強制します。
      ignore-missing: false

formatters:
  enable:
    - gofmt
    - goimports
